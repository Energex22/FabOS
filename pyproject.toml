[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"

[project]
name="wirevault-fabos"
version="0.1.0"
requires-python=">=3.8"
dependencies=[
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "waitress>=3,<4",
  "Pillow>=9.5,<11",
  "httpx>=0.27,<0.29",
]

[tool.setuptools.packages.find]
where=["."]
include=["fabos_core*","fabos_desktop*","fabos_sdk*","plugins*"]
